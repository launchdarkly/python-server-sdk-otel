name: Run Release Please

on:
  push:
    branches: [ main ]

jobs:
  release-package:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Needed if using OIDC to get release secrets.
      contents: write # Needed for release-please to create releases.
      pull-requests: write
      attestations: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release

      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        with:
          fetch-depth: 0 # Full history is required for proper changelog generation

      - name: Install poetry
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        uses: abatilo/actions-poetry@3765cf608f2d4a72178a9fc5b918668e542b89b1
        with:
          poetry-version: "1.8.5"

      - uses: actions/setup-python@v7
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        with:
          python-version: "3.10"

      - uses: launchdarkly/gh-actions/actions/release-secrets@release-secrets/v1
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        name: 'Get PyPI token'
        with:
          aws_assume_role: ${{ vars.AWS_ROLE_ARN }}
          ssm_parameter_pairs: '/production/common/releasing/pypi/token = PYPI_AUTH_TOKEN'

      - uses: ./.github/actions/build
        if: ${{ steps.release.outputs.releases_created == 'true' }}

      - uses: ./.github/actions/build-docs
        if: ${{ steps.release.outputs.releases_created == 'true' }}

      - name: Publish package distributions to PyPI
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          password: ${{env.PYPI_AUTH_TOKEN}}

      - name: Attest build provenance
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        uses: actions/attest@v4
        with:
          subject-path: 'dist/*'
