[tool.poetry]
name = "launchdarkly-server-sdk-otel"
version = "1.3.0"
description = "LaunchDarkly SDK OpenTelemetry integration"
authors = ["LaunchDarkly <dev@launchdarkly.com>"]
license = "Apache-2.0"
readme = "README.md"
homepage = "https://docs.launchdarkly.com/sdk/server-side/python"
repository = "https://github.com/launchdarkly/python-server-sdk-otel"
documentation = "https://launchdarkly-python-sdk-otel-integration.readthedocs.io/en/latest/"
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
]
packages = [ { include = "ldotel" } ]
exclude = [
    { path = "ldotel/testing", format = "wheel" }
]

[tool.poetry.dependencies]
python = ">=3.10"
launchdarkly-server-sdk = ">=9.18.3"
opentelemetry-sdk = ">=1.24.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=2.8"
pytest-cov = ">=2.4.0"
pytest-mypy = "==1.1.0"
mypy = "==2.4.0"
pycodestyle = "^2.12.1"
isort = ">=5.13.2,<7.0.0"


[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
sphinx = ">=6,<9"
sphinx-rtd-theme = ">=1.3,<4.0"
expiringdict = ">=1.1.4"
pyrfc3339 = ">=1.0"
jsonpickle = ">1.4.1"
semver = ">=2.7.9"
urllib3 = ">=1.26.0"
jinja2 = "3.1.6"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
install_types = true
non_interactive = true


[tool.pytest.ini_options]
addopts = ["-ra"]


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
